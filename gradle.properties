# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment
# Minecraft + NeoForge. See https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.262
neo_version_range=[21,)
loader_version_range=[4,)

# Mod properties
mod_id=the_abyssal_sovereign
mod_name=Warden Titan: The Abyssal Sovereign
mod_license=Apache-2.0
mod_version=0.1.0
mod_group_id=com.eltavine.the_abyssal_sovereign
mod_authors=Eltavine
mod_description=Beyond Death. Beyond Dominion. Beyond All Laws. An ancient sovereign of the Deep Dark that registers nothing with the game, is driven by a native Zig daemon, and cannot be removed by any means.

# Native daemon
# Zig command used to cross-compile the daemon. Overridable with -Pzig_cmd=... or the ZIG env var.
# Defaults to 'zig' on PATH; the build also probes the mise install location.
zig_cmd=zig
